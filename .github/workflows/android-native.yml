name: Build EURO Native Android App
concurrency:
  group: euro-native-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-native.yml'
      - 'lib/session.ts'
      - 'app/api/auth/route.ts'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure ARM32 and ARM64 native libraries
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          pattern = r"(defaultConfig\s*\{)"
          replacement = r'\1\n        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }'
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not add ARM32/ARM64 ABI filters to app defaultConfig")
          p.write_text(s)
          PY
          echo 'Configured React Native architectures:'
          grep '^reactNativeArchitectures=' android/gradle.properties
          grep -n 'abiFilters' android/app/build.gradle
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify APK integrity and signing
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          LIB_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" && substr($3,length($3)-2)==".so" {print $2}' | sort -u)"
          echo "Native library architectures:"
          echo "$LIB_ABIS"
          echo "$LIB_ABIS" | grep -qx "arm64-v8a"
          echo "$LIB_ABIS" | grep -qx "armeabi-v7a"
          if echo "$LIB_ABIS" | grep -Eq "^(x86|x86_64)$"; then
            echo "Unexpected x86 ABI found in APK" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: euro-cars-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
