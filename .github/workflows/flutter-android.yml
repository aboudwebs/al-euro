name: Build EURO CARS Flutter Android
on:
  workflow_dispatch:
  push:
    branches: [main, feat/flutter-native-app]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.eurocars .
      - name: Configure Firebase Auth
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_B64" ]; then
            echo "EURO_FIREBASE_ENABLED=false" >> "$GITHUB_ENV"
            echo "Firebase configuration secret is not set; legacy phone login remains buildable."
            exit 0
          fi
          mkdir -p flutter_app/android/app
          printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > flutter_app/android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_kts = Path("flutter_app/android/settings.gradle.kts")
          settings_groovy = Path("flutter_app/android/settings.gradle")
          app_kts = Path("flutter_app/android/app/build.gradle.kts")
          app_groovy = Path("flutter_app/android/app/build.gradle")

          if settings_kts.exists():
              p = settings_kts
              text = p.read_text()
              if "com.google.gms.google-services" not in text:
                  text, count = re.subn(r"plugins\s*\{", 'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false', text, count=1)
                  if not count: raise SystemExit("Could not locate Android Gradle plugins block")
                  p.write_text(text)
          elif settings_groovy.exists():
              p = settings_groovy
              text = p.read_text()
              if "com.google.gms.google-services" not in text:
                  text, count = re.subn(r"plugins\s*\{", "plugins {\n    id 'com.google.gms.google-services' version '4.4.4' apply false", text, count=1)
                  if not count: raise SystemExit("Could not locate Android Gradle plugins block")
                  p.write_text(text)
          else:
              raise SystemExit("Generated Android Gradle settings file not found")

          p = app_kts if app_kts.exists() else app_groovy
          text = p.read_text()
          if "com.google.gms.google-services" not in text:
              plugin = '    id("com.google.gms.google-services")' if p.suffix == ".kts" else "    id 'com.google.gms.google-services'"
              text, count = re.subn(r"plugins\s*\{", lambda m: m.group(0) + "\n" + plugin, text, count=1)
              if not count: raise SystemExit("Could not locate app Gradle plugins block")
              p.write_text(text)
          # Firebase Auth requires Android API 23 or newer.
          if p.suffix == ".kts":
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", text)
          else:
              text = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", text)
          p.write_text(text)

          manifest = Path("flutter_app/android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              manifest_text = manifest.read_text().replace(' android:taskAffinity=""', "")
              manifest.write_text(manifest_text)
          PY
          echo "EURO_FIREBASE_ENABLED=true" >> "$GITHUB_ENV"
      - name: Set Android minimum SDK for Firebase Auth compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("flutter_app/android/app/build.gradle.kts")
          if not p.exists():
              p = Path("flutter_app/android/app/build.gradle")
          text = p.read_text()
          if p.suffix == ".kts":
              text = re.sub(r"minSdk\\s*=\\s*flutter\\.minSdkVersion", "minSdk = 23", text)
          else:
              text = re.sub(r"minSdkVersion\\s+flutter\\.minSdkVersion", "minSdkVersion 23", text)
          p.write_text(text)
          PY
      - name: Resolve packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Run tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Build APK for ARM32 and ARM64
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=EURO_FIREBASE_ENABLED=$EURO_FIREBASE_ENABLED
      - name: Verify APK archive and Android signature
        run: |
          APK=flutter_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -Z1 "$APK" | grep -q 'lib/armeabi-v7a/'
      - uses: actions/upload-artifact@v4
        with:
          name: euro-cars-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
