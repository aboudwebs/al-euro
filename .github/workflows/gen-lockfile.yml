# One-off: generates package-lock.json on a clean runner and commits it. Removed right after use.
name: Generate lockfile (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Resolve dependencies into package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Check the lockfile installs cleanly
        run: npm ci --ignore-scripts

      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile change"; exit 0; }
          git commit -m "Add package-lock.json (generated once by CI) [skip render]"
          git push origin HEAD:main
